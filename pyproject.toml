[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outagefm"
version = "1.0.0"
description = "OutageFM: transferable county-level outage forecasts from outage persistence and event risk"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<4", "pyarrow>=16,<30",
  "torch>=2.4,<3", "scikit-learn>=1.4,<2", "PyYAML>=6,<7", "requests>=2.31,<3",
]

[project.optional-dependencies]
# Data preparation only: GRIB decoding of the weather archives and the IEM warning shapefiles.
data = ["eccodes>=2.38", "pyogrio>=0.7"]
dev = ["ruff>=0.9"]

[project.scripts]
outagefm = "outagefm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
