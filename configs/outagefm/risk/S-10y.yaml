# Risk head (nested cumulative hazard, Eq. 7) on the frozen S-10y backbone: only hazard_head is trained,
# 6,000 updates. Merge into the backbone with scripts/merge_risk_field.py.
extends: ../S-10y.yaml
model:
  hazard_head: true
  hazard_structure: cumsum2d
training:
  trainable_prefixes: [hazard_head.]
  learning_rate: 0.0005
  backbone_learning_rate: 0.0005
  warmup_updates: 50
  schedule_from_seconds: false
  schedule_updates: 6000
  max_seconds: 1000000
  max_updates: 6000
  selection_weights: {hazard_bce: 1.0}
  init_checkpoint: runs/S-10y/best.pt
output_dir: runs/risk/S-10y
